<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>두더지 잡기 게임</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Arial, "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e0f7e9, #e8e7ff); color: #25352d;
      display: flex; justify-content: center; align-items: center; padding: 16px;
      user-select: none; -webkit-user-select: none;
    }
    .game {
      width: 100%; max-width: 420px; padding: 24px 18px; border-radius: 26px;
      background: white; box-shadow: 0 12px 35px rgba(50,70,60,.15); text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 28px; color: #387c55; }
    .description { margin: 0 0 20px; font-size: 14px; color: #718078; }
    .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .status-box { background: #f0f8f2; border-radius: 14px; padding: 12px 4px; }
    .status-box .label { display: block; font-size: 12px; color: #6c7d72; margin-bottom: 6px; }
    .status-box .value { font-size: 23px; font-weight: bold; color: #34764d; }
    #time { color: #e16b49; }
    .board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; padding: 12px; background: #e4f3e7; border-radius: 20px; }
    .hole {
      min-width: 0; aspect-ratio: 1 / 1; border: none; border-radius: 50%;
      background: #a9d4b2; box-shadow: inset 0 5px 0 rgba(45,105,62,.15);
      cursor: pointer; font-size: clamp(34px, 10vw, 48px); display: flex;
      align-items: center; justify-content: center; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; overflow: hidden;
    }
    .hole:active { transform: scale(.95); }
    .hole.mole { background: #c8b3f5; animation: pop .15s ease-out; }
    @keyframes pop { from { transform: scale(.8); } to { transform: scale(1); } }
    .message { min-height: 28px; margin: 18px 0 12px; font-size: 15px; font-weight: bold; color: #54705d; }
    .start-button {
      width: 100%; border: none; border-radius: 14px; padding: 15px;
      background: #438c5c; color: white; font-size: 18px; font-weight: bold;
      cursor: pointer; touch-action: manipulation;
    }
    .start-button:active { transform: scale(.98); background: #326d46; }
    .help { margin: 14px 0 0; font-size: 12px; color: #89958d; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="game">
    <h1>🐹 두더지 잡기</h1>
    <p class="description">30초 안에 두더지를 최대한 많이 잡아 봐!</p>
    <section class="status">
      <div class="status-box"><span class="label">현재 점수</span><span class="value" id="score">0</span></div>
      <div class="status-box"><span class="label">남은 시간</span><span class="value" id="time">30</span></div>
      <div class="status-box"><span class="label">최고 점수</span><span class="value" id="best">0</span></div>
    </section>
    <section class="board" id="board">
      <button class="hole" data-index="0" aria-label="구멍 1">🕳️</button>
      <button class="hole" data-index="1" aria-label="구멍 2">🕳️</button>
      <button class="hole" data-index="2" aria-label="구멍 3">🕳️</button>
      <button class="hole" data-index="3" aria-label="구멍 4">🕳️</button>
      <button class="hole" data-index="4" aria-label="구멍 5">🕳️</button>
      <button class="hole" data-index="5" aria-label="구멍 6">🕳️</button>
      <button class="hole" data-index="6" aria-label="구멍 7">🕳️</button>
      <button class="hole" data-index="7" aria-label="구멍 8">🕳️</button>
      <button class="hole" data-index="8" aria-label="구멍 9">🕳️</button>
    </section>
    <p class="message" id="message" aria-live="polite">시작 버튼을 눌러 게임을 시작해!</p>
    <button class="start-button" id="startButton">🎮 게임 시작</button>
    <p class="help">🐹 두더지가 나타난 구멍을 터치해!<br>최고 점수는 이 기기에 저장돼.</p>
  </main>
  <script>
    // 게임 설정
    const GAME_TIME = 30;       // 게임 시간(초)
    const MOLE_INTERVAL = 650;  // 두더지가 바뀌는 간격(ms)

    const holes = document.querySelectorAll(".hole");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const bestDisplay = document.getElementById("best");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let score = 0;
    let timeLeft = GAME_TIME;
    let currentMole = -1;
    let playing = false;
    let timer = null;
    let moleTimer = null;

    let bestScore = 0;
    try {
      bestScore = Number(localStorage.getItem("moleBestScore")) || 0;
    } catch (error) {
      bestScore = 0;
    }
    bestDisplay.textContent = bestScore;

    function clearHoles() {
      holes.forEach((hole) => {
        hole.textContent = "🕳️";
        hole.classList.remove("mole");
      });
      currentMole = -1;
    }

    function showMole() {
      if (!playing) return;
      const previousMole = currentMole;
      clearHoles();
      let nextMole;
      do {
        nextMole = Math.floor(Math.random() * holes.length);
      } while (holes.length > 1 && nextMole === previousMole);
      currentMole = nextMole;
      holes[currentMole].textContent = "🐹";
      holes[currentMole].classList.add("mole");
    }

    function startGame() {
      clearInterval(timer);
      clearInterval(moleTimer);
      score = 0;
      timeLeft = GAME_TIME;
      playing = true;
      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      message.textContent = "두더지를 잡아 봐!";
      startButton.textContent = "🔄 다시 시작";
      clearHoles();
      showMole();
      moleTimer = setInterval(showMole, MOLE_INTERVAL);
      timer = setInterval(() => {
        timeLeft--;
        timeDisplay.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    function endGame() {
      playing = false;
      clearInterval(timer);
      clearInterval(moleTimer);
      clearHoles();
      if (score > bestScore) {
        bestScore = score;
        bestDisplay.textContent = bestScore;
        try {
          localStorage.setItem("moleBestScore", String(bestScore));
          message.textContent = `🎉 신기록 달성! ${score}점!`;
        } catch (error) {
          message.textContent = `게임 종료! ${score}점!`;
        }
      } else {
        message.textContent = `게임 종료! 최종 점수는 ${score}점이야!`;
      }
      startButton.textContent = "🎮 다시 도전";
    }

    holes.forEach((hole, index) => {
      hole.addEventListener("click", () => {
        if (!playing) return;
        if (index === currentMole) {
          score++;
          scoreDisplay.textContent = score;
          hole.textContent = "🕳️";
          hole.classList.remove("mole");
          currentMole = -1;
          message.textContent = "잘했어! +1점 🐹";
          clearInterval(moleTimer);
          showMole();
          moleTimer = setInterval(showMole, MOLE_INTERVAL);
        }
      });
    });

    startButton.addEventListener("click", startGame);
  </script>
</body>
</html>
