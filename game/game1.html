<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>반응속도 테스트</title> <style> * { box-sizing: border-box; } html, body { margin: 0; width: 100%; min-height: 100%; font-family: Arial, sans-serif; } body { overflow: hidden; } #game { min-height: 100vh; min-height: 100dvh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; color: white; text-align: center; background: #e53935; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; } #game.green { background: #159447; } #game.result { background: #253047; } h1 { font-size: clamp(1.7rem, 7vw, 2.5rem); margin: 0 0 20px; } #message { font-size: clamp(1.3rem, 5vw, 1.8rem); font-weight: bold; line-height: 1.5; white-space: pre-line; } #submessage { margin-top: 12px; font-size: 1rem; line-height: 1.6; } #round { margin-top: 24px; font-size: 1rem; font-weight: bold; } #history { margin-top: 14px; line-height: 1.8; font-size: 0.95rem; } button { border: none; border-radius: 14px; padding: 14px 24px; margin-top: 22px; font-size: 1.05rem; font-weight: bold; color: #253047; background: white; cursor: pointer; touch-action: manipulation; } .hidden { display: none; } </style> </head> <body> <main id="game"> <h1>⚡ 반응속도 테스트</h1> <div id="message">화면을 눌러 시작!</div> <div id="submessage"> 초록색으로 바뀌면 바로 터치하세요. </div> <div id="round">1 / 5회</div> <div id="history"></div> <button id="restart" class="hidden"> 다시 하기 </button> </main> <script> const game = document.getElementById("game"); const message = document.getElementById("message"); const submessage = document.getElementById("submessage"); const roundDisplay = document.getElementById("round"); const historyDisplay = document.getElementById("history"); const restartButton = document.getElementById("restart"); let state = "ready"; let round = 0; let results = []; let greenTime = 0; let timer = null; // 회차 표시 function showRound() { roundDisplay.textContent = `${Math.min(round + 1, 5)} / 5회`; } // 게임 시작 및 초기화 function startGame() { clearTimeout(timer); round = 0; results = []; historyDisplay.textContent = ""; restartButton.classList.add("hidden"); state = "ready"; nextAttempt(); } // 한 회차 시작 function nextAttempt() { state = "waiting"; game.className = ""; game.style.background = "#e53935"; message.textContent = "🔴 기다리세요..."; submessage.textContent = "초록색으로 바뀌면 바로 터치하세요!"; showRound(); // 1.5초~5초 사이의 랜덤 대기 const delay = 1500 + Math.random() * 3500; timer = setTimeout(() => { if (state !== "waiting") return; state = "green"; game.className = "green"; message.textContent = "🟢 지금 터치!"; submessage.textContent = "최대한 빠르게 누르세요!"; greenTime = performance.now(); }, delay); } // 화면을 눌렀을 때 function handleTap(event) { if (event.target === restartButton) return; // 처음 시작 if (state === "ready") { nextAttempt(); return; } // 빨간색일 때 누른 경우 if (state === "waiting") { clearTimeout(timer); state = "early"; game.className = ""; game.style.background = "#e53935"; message.textContent = "너무 빨라요! 😅"; submessage.textContent = "화면을 눌러 같은 회차를 다시 시도하세요."; return; } // 너무 빨리 눌렀다면 재시도 if (state === "early") { nextAttempt(); return; } // 초록색일 때 누른 경우 if (state === "green") { const reaction = Math.round(performance.now() - greenTime); results.push(reaction); round++; state = "between"; game.className = "result"; message.textContent = `${reaction} ms`; historyDisplay.textContent = "기록: " + results.map((v, i) => `${i + 1}회 ${v}ms`).join(" · "); showRound(); // 5회 완료 if (round >= 5) { state = "result"; const average = Math.round( results.reduce((sum, value) => sum + value, 0) / results.length ); message.textContent = `🏆 평균 반응속도\n${average} ms`; submessage.textContent = "5회 측정 완료! 다시 도전해 보세요."; restartButton.classList.remove("hidden"); } else { submessage.textContent = "기록 완료! 화면을 눌러 다음 회차로 가세요."; } return; } // 다음 회차 if (state === "between") { nextAttempt(); } } // 휴대폰 터치 및 마우스 지원 game.addEventListener("pointerdown", handleTap); // 다시 하기 버튼 restartButton.addEventListener("pointerdown", (event) => { event.stopPropagation(); startGame(); }); </script> </body> </html>
